# Basado en el docker-compose.yml oficial de Immich v3.3.3, sin el servicio de machine learning.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.3
    restart: unless-stopped
    ports:
      - "${PORT}:2283"
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    volumes:
      - ${DATA}/library:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
  redis:
    image: docker.io/valkey/valkey:9.0.6-alpine
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: HDD
    volumes:
      - ${DATA}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
