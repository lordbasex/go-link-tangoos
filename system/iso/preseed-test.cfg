
#### Variante "test" (laboratorio): sin preguntas, IP fija, SSH de root solo con la llave de desarrollo.
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string @@IP@@
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string @@GW@@
d-i netcfg/get_nameservers string 8.8.8.8
d-i netcfg/confirm_static boolean true
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string ca-certificates avahi-daemon openssh-server
d-i preseed/late_command string \
    cp /cdrom/tangoos/tangoos.deb /target/tmp/tangoos.deb; \
    in-target apt-get install -y /tmp/tangoos.deb; \
    in-target systemctl enable tangod.service; \
    in-target passwd -l root; \
    rm -f /target/tmp/tangoos.deb; \
    mkdir -p /target/root/.ssh; \
    cp /cdrom/tangoos/authorized_keys /target/root/.ssh/authorized_keys; \
    chmod 700 /target/root/.ssh; chmod 600 /target/root/.ssh/authorized_keys
