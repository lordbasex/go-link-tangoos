
#### Variante "product": DHCP, sin SSH. Antes de escribir el disco el instalador muestra
#### el resumen de particiones y pide confirmación (partman/confirm NO se responde acá).
tasksel tasksel/first multiselect
d-i pkgsel/include string ca-certificates avahi-daemon
d-i preseed/late_command string \
    cp /cdrom/tangoos/tangoos.deb /target/tmp/tangoos.deb; \
    in-target apt-get install -y /tmp/tangoos.deb; \
    in-target systemctl enable tangod.service; \
    in-target passwd -l root; \
    rm -f /target/tmp/tangoos.deb
