#### TangoOS — preseed del instalador (Debian 13 "trixie", debian-installer)
# Común a las variantes "product" y "test". build.sh agrega al final el bloque de la variante.
# Objetivo: una sola pregunta (el disco de sistema, si hay más de uno) y una confirmación
# antes de escribir en él (docs/04, docs/08). El resto se responde acá.

### Idioma, país, teclado
d-i debian-installer/locale string es_AR.UTF-8
d-i debian-installer/language string es
d-i debian-installer/country string AR
d-i localechooser/supported-locales multiselect es_AR.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select latam

### Red y nombre: el NAS se llama "tango" → https://tango.local
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string tango
d-i netcfg/get_domain string local
d-i netcfg/hostname string tango
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean false

### Mirror (las actualizaciones posteriores salen de acá)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

### Cuentas: root bloqueado y sin usuarios de consola. TangoOS se administra desde el escritorio
### web; tangod crea "admin" en el primer arranque (protocol/README.md §4).
# d-i no acepta "!" como clave: build.sh pone un hash de una clave aleatoria que nadie conoce
# y late_command bloquea la cuenta con passwd -l.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password @@ROOT_HASH@@
d-i passwd/make-user boolean false

### Hora
d-i clock-setup/utc boolean true
d-i time/zone string America/Argentina/Buenos_Aires
d-i clock-setup/ntp boolean true

### Disco de sistema
# Si hay un solo disco se usa ese; si hay más, el instalador pregunta cuál (nunca se elige solo).
d-i partman/early_command string \
    set -- $(list-devices disk); \
    if [ "$#" -eq 1 ]; then debconf-set partman-auto/disk "$1"; fi
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-basicfilesystems/no_swap boolean false
# BIOS: partición bios_grub de 1 MB; UEFI: ESP de 512 MB. /boot ext4 y raíz Btrfs (docs/08).
d-i partman-auto/expert_recipe string                               \
    tango ::                                                        \
        1 1 1 free                                                  \
            $bios_boot{ } method{ biosgrub } .                      \
        512 512 512 free                                            \
            $iflabel{ gpt } $reusemethod{ }                         \
            method{ efi } format{ } .                               \
        1024 1024 1024 ext4                                         \
            method{ format } format{ }                              \
            use_filesystem{ } filesystem{ ext4 }                    \
            mountpoint{ /boot } .                                   \
        4096 8192 -1 btrfs                                          \
            method{ format } format{ }                              \
            use_filesystem{ } filesystem{ btrfs }                   \
            mountpoint{ / } .
d-i partman-auto/choose_recipe select tango
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish

### Paquetes: Debian mínimo, sin recomendados, sin entorno gráfico
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Cargador de arranque
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Fin
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
